<text x="84.0" y="419.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">paired but silent: yellow · packets arriving from the paired hand: green</text>
