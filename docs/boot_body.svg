<text x="884.0" y="329.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">pair with 'espnow scan' on the hand unit,</text>
<text x="884.0" y="345.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">or hold the body's button 2 s</text>
