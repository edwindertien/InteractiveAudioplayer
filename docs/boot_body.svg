<text x="84.0" y="337.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Wi-Fi station mode, ESP-NOW init, broadcast peer added</text>
