<rect x="70.0" y="451.6" width="1360.0" height="109.8" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="84.0" y="473.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">loop() and the receive callback</text>
<text x="84.0" y="493.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">serial commands: status · mac · stream · clear · help</text>
<text x="84.0" y="509.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">status LED derived every frame from pairing + time of the last packet</text>
<text x="84.0" y="525.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">heartbeat to the hand unit every 1 s</text>
<text x="84.0" y="541.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">pair button: hold 2 s → pairing mode, PAIR_REQUEST broadcast every 300 ms for 30 s</text>
<text x="760.0" y="493.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">ESP-NOW receive: PING → PONG and pair · PAIR_ACK → pair</text>
<text x="760.0" y="509.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">data (proximity, NFC, touch) is accepted ONLY from the paired hand</text>
<text x="760.0" y="525.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">→ forwarded to the Teensy as JSON lines  p / n / c</text>
<text x="760.0" y="541.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">packets from anyone else are counted and ignored</text>
</svg>
