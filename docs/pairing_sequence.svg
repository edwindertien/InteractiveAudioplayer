</defs>
<rect width="1500" height="738" fill="#ffffff"/>
<text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold">Pairing a hand unit with its body bridge</text>
<text x="24.0" y="56.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Two ways. Both store the other unit's MAC address in flash, so pairing survives reboots and sleep.</text>
<text x="24.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">A · from the hand unit's serial CLI</text>
<text x="780.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">B · with the two buttons</text>
<line x1="170.0" y1="148.0" x2="170.0" y2="708.0" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="570.0" y1="148.0" x2="570.0" y2="708.0" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5,4"/>
<rect x="80.0" y="172.0" width="180.0" height="52.0" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
<text x="92.0" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">you type</text>
<text x="92.0" y="205.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">espnow scan</text>
<polyline points="170.0,280.0 570.0,280.0" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="349.1" y="245.5" width="41.8" height="18.5" rx="4" fill="#ffffff" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="370.0" y="258.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="bold">PING</text>
<text x="370.0" y="272.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">broadcast</text>
<rect x="450.0" y="296.0" width="240.0" height="52.0" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="462.0" y="314.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">pairs with the sender</text>
<text x="462.0" y="329.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">stores its MAC in flash</text>
<polyline points="570.0,404.0 170.0,404.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#m1)"/>
<rect x="346.4" y="369.5" width="47.3" height="18.5" rx="4" fill="#ffffff" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="370.0" y="382.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="bold">PONG</text>
<text x="370.0" y="396.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">unicast reply</text>
<rect x="50.0" y="420.0" width="240.0" height="52.0" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
<text x="62.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">pairs with the body</text>
<text x="62.0" y="453.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">stores its MAC in flash</text>
<polyline points="570.0,514.0 170.0,514.0" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#m1)"/>
<rect x="295.9" y="493.5" width="148.2" height="18.5" rx="4" fill="#ffffff" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="370.0" y="506.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="bold">HEARTBEAT every 1 s</text>
<polyline points="170.0,560.0 570.0,560.0" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="283.6" y="539.5" width="172.8" height="18.5" rx="4" fill="#ffffff" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="370.0" y="552.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="bold">PROXIMITY every 100 ms</text>
<rect x="80.0" y="576.0" width="580.0" height="52.0" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
<text x="92.0" y="594.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">both status LEDs turn GREEN</text>
<text x="92.0" y="609.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">(red = unpaired · yellow = paired, no answer)</text>
<rect x="80.0" y="640.0" width="580.0" height="52.0" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<text x="92.0" y="658.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">The body pairs with whichever hand unit pings.</text>
<text x="92.0" y="673.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">With several pairs in one room, pair one set at a time.</text>
<rect x="80.0" y="104.0" width="180.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="170.0" y="123.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#7c2d12" text-anchor="middle" font-weight="bold">Hand unit</text>
<text x="170.0" y="138.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">serial CLI</text>
<rect x="480.0" y="104.0" width="180.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="570.0" y="123.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="bold">Body bridge</text>
<text x="570.0" y="138.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">powered, unpaired</text>
<line x1="870.0" y1="148.0" x2="870.0" y2="680.0" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="1270.0" y1="148.0" x2="1270.0" y2="680.0" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5,4"/>
<rect x="1155.0" y="172.0" width="230.0" height="52.0" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="1167.0" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">hold the button (GPIO 9)</text>
<text x="1167.0" y="205.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">for 2 seconds</text>
<rect x="1155.0" y="236.0" width="230.0" height="52.0" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="1167.0" y="254.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">pairing mode: LED blinks</text>
<text x="1167.0" y="269.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">BLUE fast, for up to 30 s</text>
<polyline points="1270.0,344.0 870.0,344.0" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m2)"/>
<rect x="1017.5" y="309.5" width="105.0" height="18.5" rx="4" fill="#ffffff" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="1070.0" y="322.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="bold">PAIR_REQUEST</text>
<text x="1070.0" y="336.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">broadcast every 300 ms</text>
<rect x="760.0" y="360.0" width="220.0" height="52.0" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
<text x="772.0" y="378.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">LED blinks BLUE:</text>
<text x="772.0" y="393.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">a request is pending</text>
<rect x="760.0" y="424.0" width="220.0" height="52.0" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
<text x="772.0" y="442.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">you tap the hand unit's</text>
<text x="772.0" y="457.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">button (shorter than 2 s)</text>
<polyline points="870.0,532.0 1270.0,532.0" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="1034.3" y="497.5" width="71.4" height="18.5" rx="4" fill="#ffffff" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="1070.0" y="510.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="bold">PAIR_ACK</text>
<text x="1070.0" y="524.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">unicast</text>
<rect x="780.0" y="548.0" width="580.0" height="52.0" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
<text x="792.0" y="566.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">both store each other's MAC; pairing mode ends</text>
<text x="792.0" y="581.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">HEARTBEAT / PROXIMITY start → both LEDs GREEN</text>
<rect x="780.0" y="612.0" width="580.0" height="52.0" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<text x="792.0" y="630.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">Only the body in pairing mode can be paired this way,</text>
<text x="792.0" y="645.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">so it is the safe method with many pairs in one room.</text>
<rect x="780.0" y="104.0" width="180.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="870.0" y="123.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#7c2d12" text-anchor="middle" font-weight="bold">Hand unit</text>
<text x="870.0" y="138.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">awake, unpaired</text>
<rect x="1180.0" y="104.0" width="180.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1270.0" y="123.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="bold">Body bridge</text>
<text x="1270.0" y="138.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">powered</text>
