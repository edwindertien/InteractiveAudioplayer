<rect width="1500" height="640" fill="#ffffff"/>
<text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold">A show from start to finish — states and what moves between them</text>
<text x="24.0" y="56.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Chapter names are those of the generated configs. Tags that toggle layers (narrator, overlays) work in every state.</text>
<rect x="30.0" y="150.0" width="250.0" height="105.0" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="40.0" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">WAITING ROOM</text>
<text x="40.0" y="188.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">start_arrival  (loops)</text>
<text x="40.0" y="203.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">plays from power-on —</text>
<text x="40.0" y="219.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">no tag needed yet</text>
<text x="155.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">boot</text>
<polyline points="155.0,128.0 155.0,150.0" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="380.0" y="100.0" width="800.0" height="290.0" rx="14" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="394.0" y="120.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="bold">SHOW RUNNING — the clock started when the start tag was seen</text>
<rect x="420.0" y="150.0" width="280.0" height="105.0" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="430.0" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="bold">BASE</text>
<text x="430.0" y="188.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">base  (loops)</text>
<text x="430.0" y="203.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">the hub between encounters</text>
<rect x="850.0" y="150.0" width="300.0" height="105.0" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
