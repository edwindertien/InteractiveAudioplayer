<text x="860.0" y="188.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">recharge (own tag) or one of</text>
<text x="860.0" y="203.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">enc_play · enc_suspense · enc_loneliness</text>
<text x="860.0" y="219.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">enc_nurture · enc_pressure · enc_shift</text>
<text x="860.0" y="235.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">play once, ~45 s each</text>
