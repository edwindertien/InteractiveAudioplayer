<text x="40.0" y="486.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">narrator / overlay tags toggle that layer</text>
<text x="40.0" y="501.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">effects play from RAM; the general audio</text>
