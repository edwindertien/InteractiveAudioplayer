<text x="330.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">starts the clock</text>
<text x="405.0" y="335.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">lock on: a person tag is accepted in BASE only — anywhere else it gets the 'denied' sound</text>
<text x="405.0" y="354.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">lock off (testing): person tags switch chapter at any time</text>
<text x="30.0" y="290.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">A start tag in any state restarts the show</text>
<text x="30.0" y="306.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">from BASE with a fresh clock.</text>
<rect x="420.0" y="450.0" width="280.0" height="96.8" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="430.0" y="468.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#7f1d1d" text-anchor="start" font-weight="bold">ENDING</text>
<text x="430.0" y="488.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">time is up (end_after_min)</text>
<text x="430.0" y="503.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">the chapter that is playing finishes;</text>
<text x="430.0" y="519.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">a loop finishes its current pass</text>
<text x="430.0" y="535.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">new person tags are refused</text>
<rect x="780.0" y="450.0" width="250.0" height="100.0" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="790.0" y="468.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="bold">END CHAPTER</text>
<text x="790.0" y="488.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">end_reflection</text>
<text x="790.0" y="503.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">plays once</text>
<rect x="1110.0" y="450.0" width="250.0" height="100.0" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="1120.0" y="468.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">SHOW OVER</text>
<text x="1120.0" y="488.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">sound and LEDs off</text>
