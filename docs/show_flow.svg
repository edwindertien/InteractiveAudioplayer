<text x="40.0" y="532.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="normal">serial:  show · show 0.5 · show end · lock · duck</text>
