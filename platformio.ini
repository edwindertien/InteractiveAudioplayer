# ============================================================
# Interactive Audio Player — PlatformIO config
#
# NFC reading now happens on the wearer's hand unit (ESP32-S3 +
# PN532), forwarded through an ESP32-S3 body bridge over UART.
# The Teensy has no NFC hardware of its own — single environment.
# ============================================================

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino
monitor_speed = 115200

build_flags =
    -DAUDIO_BLOCK_SAMPLES=128
    ; USB type: serial (CDC) + MTP together — needed by UsbMaintenance.h.
    ; MTP itself is bundled in the Teensy core: do NOT add the MTP_Teensy library.
    -DUSB_MTPDISK_SERIAL

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ; Pinned to 3.10.1 on purpose. 3.10.2/3.10.3 compile an SD-card file that
    ; includes <fs.h> before <Arduino.h>; with the MTP USB type that breaks the
    ; core's MTP headers ('FS' has not been declared). 3.10.1 never compiles it.
    fastled/FastLED @ 3.10.1